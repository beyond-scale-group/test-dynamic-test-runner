name: Test Dynamic Test Runner

on:
  workflow_dispatch:
    inputs:
      test_case:
        description: 'Test case ID (e.g., DTR-001)'
        required: false
        type: string
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Detect changed projects
        id: detect
        run: |
          # Find all test-config.json files
          configs=$(find . -name "test-config.json" -type f | grep -v node_modules || true)
          
          if [ -z "$configs" ]; then
            echo "No test-config.json files found"
            echo "matrix=[]" >> $GITHUB_OUTPUT
            echo "has-changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Get base ref for comparison
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA=${{ github.event.pull_request.base.sha }}
          else
            BASE_SHA=$(git rev-parse HEAD^)
          fi
          
          # Get changed files
          changed_files=$(git diff --name-only $BASE_SHA HEAD || true)
          
          if [ -z "$changed_files" ]; then
            echo "No files changed"
            echo "matrix=[]" >> $GITHUB_OUTPUT
            echo "has-changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Changed files: $changed_files"
          
          # Build matrix
          matrix="["
          first=true
          has_changes=false
          
          for config in $configs; do
            project_dir=$(dirname $config)
            project_name=$(basename $project_dir)
            
            # Check if any changed file is in this project
            for file in $changed_files; do
              if [[ "$file" == "$project_dir"* ]]; then
                # Read test-config.json
                name=$(jq -r '.name // "'$project_name'"' $config)
                test_cmd=$(jq -r '.test // "npm test"' $config)
                
                if [ "$first" = true ]; then
                  first=false
                else
                  matrix="$matrix,"
                fi
                
                matrix="$matrix{\"name\":\"$name\",\"projectPath\":\"$project_dir\",\"stepTest\":\"$test_cmd\"}"
                has_changes=true
                break
              fi
            done
          done
          
          matrix="$matrix]"
          
          echo "Matrix: $matrix"
          echo "matrix=$matrix" >> $GITHUB_OUTPUT
          echo "has-changes=$has_changes" >> $GITHUB_OUTPUT

  test:
    needs: detect
    if: needs.detect.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup project
        run: |
          cd ${{ matrix.projectPath }}
          if [ -f "package.json" ]; then npm install; fi
          
      - name: Run tests
        run: |
          cd ${{ matrix.projectPath }}
          ${{ matrix.stepTest }}
